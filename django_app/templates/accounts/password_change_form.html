{% extends "base.html" %}

{% block title %}Alterar senha | Print Fornece{% endblock %}

{% block content %}
  <section class="card form-card password-card">
    <div class="section-heading">
      <div>
        <h2>Alterar senha</h2>
        <p>Use uma senha com pelo menos oito caracteres e não a reutilize.</p>
      </div>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" with form=form %}
      <div class="form-actions">
        <a class="btn btn-secondary" href="{% url 'accounts:profile' %}">Cancelar</a>
        <button class="btn btn-primary" type="submit">Alterar senha</button>
      </div>
    </form>
  </section>
{% endblock %}
