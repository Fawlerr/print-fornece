{% if form.non_field_errors %}
  <div class="form-error" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for hidden_field in form.hidden_fields %}
  {{ hidden_field }}
  {% if hidden_field.errors %}<div class="field-errors" role="alert">{{ hidden_field.errors }}</div>{% endif %}
{% endfor %}
<div class="form-grid">
  {% for field in form.visible_fields %}
    <label class="{% if field.field.required %}required {% endif %}{% if field.name == 'description' or field.name == 'internal_notes' or field.name == 'note' or field.name == 'text' %}full{% endif %}" for="{{ field.id_for_label }}">
      {{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}
      {{ field }}
      {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
      {% if field.errors %}<span class="field-errors" role="alert">{{ field.errors }}</span>{% endif %}
    </label>
  {% endfor %}
</div>
