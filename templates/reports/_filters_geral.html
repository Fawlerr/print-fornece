<label for="{{ filter_form.stage.id_for_label }}">Etapa{{ filter_form.stage }}</label>
<label for="{{ filter_form.payment_status.id_for_label }}">Pagamento{{ filter_form.payment_status }}</label>
<label for="filtro-responsavel">Funcionário
  <select id="filtro-responsavel" name="responsible">
    <option value="">Todos</option>
    {% for responsible in users %}
      <option value="{{ responsible.pk }}"{% if filter_form.responsible.value|stringformat:"s" == responsible.pk|stringformat:"s" %} selected{% endif %}>{{ responsible.name }}</option>
    {% endfor %}
  </select>
</label>
<label for="{{ filter_form.priority.id_for_label }}">Prioridade{{ filter_form.priority }}</label>
