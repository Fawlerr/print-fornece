services:
  app:
    build:
      context: .
    environment:
      SECRET_KEY: "${SECRET_KEY:-django-insecure-key-change-me-in-production}"
      DEBUG: "${DEBUG:-false}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME:-print_fornece}"
      DB_USER: "${DB_USER:-print_user}"
      DB_PASSWORD: "${DB_PASSWORD:-print_password}"
      TIMEZONE: "${TIMEZONE:-America/Fortaleza}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@printfornece.com.br}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123456}"
      ADMIN_NAME: "${ADMIN_NAME:-Administrador}"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    volumes:
      - print_fornece_uploads:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - print_fornece_internal

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: "${DB_NAME:-print_fornece}"
      MARIADB_USER: "${DB_USER:-print_user}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-print_password}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_password}"
      TZ: "${TIMEZONE:-America/Fortaleza}"
    volumes:
      - print_fornece_db:/var/lib/mysql
      - ./database/print_fornece.sql:/docker-entrypoint-initdb.d/01-print-fornece.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - print_fornece_internal

volumes:
  print_fornece_db:
  print_fornece_uploads:

networks:
  print_fornece_internal:
    driver: bridge
